<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himnario</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Himnario">
<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#edf0f7;--surface:#fafbff;--primary:#3b5998;--primary-d:#2d4680;
  --chord:#9b2335;--key:#5b4b8a;--text:#1a2b42;--muted:#6b7fa3;
  --border:#cdd5e8;--danger:#b83232;--r:8px;
  --header-grad:linear-gradient(135deg,#2d4680 0%,#3b5998 55%,#5b6faa 100%);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1724;--surface:#1a2540;--primary:#4a6ab0;--primary-d:#3b5998;
  --chord:#e05c6a;--key:#7b68c8;--text:#e8edf8;--muted:#8a9fc0;
  --border:#2a3a5a;--danger:#e05c6a;
  --header-grad:linear-gradient(135deg,#1a2c50 0%,#243560 55%,#2d4070 100%);
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;min-height:100vh}

/* ── Header ── */
header{background:var(--header-grad);color:#fff;padding:10px 16px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.3)}
header .logo{height:44px;width:auto;object-fit:contain;filter:brightness(0) invert(1);opacity:.92}
header h1{font-size:1.05rem;font-weight:700;flex:1;white-space:nowrap;
  letter-spacing:.03em;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.ntoggle{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);
  border-radius:20px;padding:4px 13px;cursor:pointer;font-size:.8rem;font-weight:700;
  white-space:nowrap;transition:background .2s}
.ntoggle:hover{background:rgba(255,255,255,.3)}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:6px;padding:5px 11px;cursor:pointer;font-size:.78rem;font-weight:600;
  transition:background .2s}
.hbtn:hover{background:rgba(255,255,255,.28)}
/* Botón de candado admin */
.lock-btn{background:transparent;border:none;color:#fff;font-size:1.15rem;cursor:pointer;
  padding:4px 6px;opacity:.75;transition:opacity .2s;line-height:1}
.lock-btn:hover{opacity:1}
.lock-btn.open{opacity:1}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:var(--r);
  border:none;cursor:pointer;font-size:.9rem;font-weight:500;transition:all .15s;text-decoration:none}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-d)}
.btn-s{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-s:hover{background:var(--bg)}
.btn-d{background:var(--danger);color:#fff}.btn-d:hover{filter:brightness(.9)}
.btn-g{background:transparent;color:var(--primary);padding:5px 9px}
.btn-g:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:.82rem}
.btn-icon{padding:5px 10px;font-size:.95rem;font-weight:700}

/* ── Layout ── */
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.view{display:none}.view.active{display:block}

/* ── List ── */
.search-wrap{padding:14px;border-bottom:1px solid var(--border)}
.search-wrap input{width:100%;padding:9px 16px;border:1px solid var(--border);
  border-radius:20px;font-size:1rem;outline:none;background:var(--bg);color:var(--text);
  transition:border-color .2s}
.search-wrap input:focus{border-color:var(--primary)}
.hymn-list{list-style:none}
.hymn-item{display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.hymn-item:last-child{border-bottom:none}
.hymn-item:hover{background:var(--bg)}
.hnum{font-weight:700;color:var(--muted);min-width:38px;font-size:.88rem}
.esp-badge{background:var(--primary);color:#fff;border-radius:6px;padding:1px 7px;
  font-size:.78rem;font-weight:700;letter-spacing:.04em}
.htitle{flex:1;font-weight:500}
.kbadge{background:var(--key);color:#fff;border-radius:12px;padding:2px 10px;
  font-size:.78rem;font-weight:700;white-space:nowrap}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty strong{font-size:1rem;color:var(--text)}

/* ── Cola ── */
.cola-item{display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.cola-item:last-child{border-bottom:none}
.cola-item:hover{background:var(--bg)}
.cola-fecha{font-weight:700;color:var(--primary);font-size:.88rem;white-space:nowrap}
.cola-titulo{flex:1;font-weight:500;color:var(--muted)}
.cola-count{font-size:.82rem;color:var(--muted);white-space:nowrap}
.pick-results{list-style:none;border:1px solid var(--border);border-radius:var(--r);
  background:var(--bg);max-height:180px;overflow-y:auto;margin-top:4px}
.pick-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .15s}
.pick-item:last-child{border-bottom:none}
.pick-item:hover{background:var(--surface)}
.cq-list{list-style:none;border:1px solid var(--border);border-radius:var(--r);min-height:52px}
.cq-item{display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--border)}
.cq-item:last-child{border-bottom:none}
.cq-idx{color:var(--muted);font-size:.82rem;min-width:18px}
.cq-title{flex:1;font-size:.93rem}
.cq-move{display:flex;gap:3px}
.cq-move button,.cq-rm{background:none;border:1px solid var(--border);border-radius:4px;
  padding:2px 7px;cursor:pointer;font-size:.75rem;color:var(--muted);line-height:1.4}
.cq-move button:hover{background:var(--bg)}
.cq-rm{border-color:transparent;color:var(--danger);font-size:.95rem}
.cq-rm:hover{background:var(--bg)}

.list-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;
  justify-content:flex-end;gap:8px;align-items:center;min-height:56px}

/* ── Hymn view ── */
.vbar{display:flex;align-items:center;gap:8px;padding:12px 14px;margin-bottom:10px}
.vbar-title{flex:1;font-size:.95rem;font-weight:600;padding-left:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hymn-head{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.hymn-head .row1{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hymn-head .vnum{font-size:.88rem;color:var(--muted);font-weight:700}
.hymn-head h2{font-size:1.45rem;font-weight:700;line-height:1.3}
.tbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.kdisp{background:var(--key);color:#fff;border-radius:12px;padding:4px 14px;
  font-size:.95rem;font-weight:700}
.tlabel{font-size:.82rem;color:var(--muted);margin-left:4px}
.toffset{background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:3px 8px;font-size:.82rem;font-weight:700;min-width:32px;text-align:center}

/* ── Chord rendering ── */
.hymn-body{padding:20px;font-size:1.07rem;line-height:1}
.chord-line{display:flex;flex-wrap:wrap;margin-bottom:2px}
.cblock{display:inline-flex;flex-direction:column;align-items:flex-start}
.cn{color:var(--chord);font-weight:700;font-size:.86em;min-height:1.35em;
  line-height:1.35;white-space:nowrap;padding-right:3px}
.cl{white-space:pre;line-height:1.65}
.lyric-line{line-height:1.65;margin-bottom:1px;white-space:pre-wrap}
.stanza{height:1em}

/* ── Editor ── */
.eform{padding:18px;display:flex;flex-direction:column;gap:15px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:110px}
.fg.full{flex:1 1 100%}
label{font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=password],textarea{
  padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);
  font-size:1rem;font-family:inherit;outline:none;
  background:var(--bg);color:var(--text);transition:border-color .2s;width:100%}
input:focus,textarea:focus{border-color:var(--primary);background:var(--surface)}
textarea#fcontent{font-family:'Menlo','Consolas','Courier New',monospace;font-size:.88rem;
  line-height:1.65;min-height:280px;resize:vertical}
.hint{font-size:.79rem;color:var(--muted);line-height:1.55;padding:9px 12px;
  background:var(--bg);border-radius:var(--r);border:1px solid var(--border)}
.hint code{background:var(--border);border-radius:3px;padding:1px 4px;font-size:.95em}
.factions{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--border);align-items:center}
.factions .sp{flex:1}

/* ── Modal de autenticación ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal-box{background:var(--surface);border-radius:12px;padding:28px 24px;
  width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal-box h3{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.modal-box p{font-size:.88rem;color:var(--muted);margin-bottom:16px;line-height:1.5}
.modal-box input{margin-bottom:6px}
.pin-error{font-size:.82rem;color:var(--danger);min-height:1.2em;margin-bottom:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

/* ── Toast ── */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);
  background:#1e293b;color:#fff;padding:9px 22px;border-radius:20px;font-size:.88rem;
  opacity:0;transition:all .28s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Misc ── */
#fimp{display:none}
.admin-only{display:none}
body.is-admin .admin-only{display:inline-flex}
body.is-admin .list-foot .admin-only{display:flex}
@media(max-width:500px){
  main{padding:8px}
  .hymn-body{padding:14px;font-size:1rem}
  .eform{padding:12px}
  header h1{font-size:.95rem}
}
@media print{
  header,.vbar,.tbar .btn,.list-foot{display:none!important}
  .cn{color:#000!important}
  .kdisp{background:#000!important}
}
</style>
</head>
<body>

<header>
  <img src="LOGO IEAP2 2.png" class="logo" alt="" onerror="this.style.display='none'">
  <h1>Himnario</h1>
  <button class="ntoggle" id="ntoggle" onclick="toggleNotation()">Do-Re-Mi</button>
  <button class="hbtn" onclick="showColas()">📋 Cola</button>
  <!-- Export/Import: solo admin -->
  <div class="admin-only" style="gap:7px">
    <button class="hbtn" onclick="exportJSON()">↑ Exportar</button>
    <button class="hbtn" onclick="document.getElementById('fimp').click()">↓ Importar</button>
  </div>
  <!-- Candado: visible siempre -->
  <button class="lock-btn" id="lockBtn" onclick="lockBtnClick()" title="Administrador">🔒</button>
  <input type="file" id="fimp" accept=".json" onchange="importJSON(event)">
</header>

<main>
  <!-- ═══ LISTA ═══ -->
  <div class="view active" id="view-list">
    <div class="card">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Buscar por número o título…" oninput="renderList()">
      </div>
      <ul class="hymn-list" id="hymnList"></ul>
      <div class="list-foot">
        <!-- Solo visible cuando es admin -->
        <button class="btn btn-p admin-only" onclick="showEditor(null)">+ Nuevo himno</button>
      </div>
    </div>
  </div>

  <!-- ═══ HIMNO ═══ -->
  <div class="view" id="view-hymn">
    <div class="vbar">
      <button class="btn btn-s btn-sm" onclick="showList()">← Volver</button>
      <span class="vbar-title" id="vbarTitle"></span>
      <!-- Solo visible cuando es admin -->
      <button class="btn btn-s btn-sm admin-only" onclick="editCurrent()">✎ Editar</button>
    </div>
    <div class="card">
      <div class="hymn-head">
        <div class="row1">
          <span class="vnum" id="vNum"></span>
          <h2 id="vTitle"></h2>
        </div>
        <div class="tbar">
          <span class="kdisp" id="kDisp"></span>
          <span class="tlabel">Transportar:</span>
          <button class="btn btn-s btn-icon btn-sm" onclick="doTranspose(-1)">−</button>
          <span class="toffset" id="tOffset">0</span>
          <button class="btn btn-s btn-icon btn-sm" onclick="doTranspose(+1)">+</button>
          <button class="btn btn-g btn-sm" onclick="resetTranspose()">Reset</button>
        </div>
      </div>
      <div class="hymn-body" id="hymnBody"></div>
    </div>
  </div>

  <!-- ═══ EDITOR ═══ -->
  <div class="view" id="view-editor">
    <div class="vbar">
      <button class="btn btn-s btn-sm" onclick="cancelEdit()">← Cancelar</button>
      <span class="vbar-title" id="edTitle">Nuevo himno</span>
    </div>
    <div class="card">
      <div class="eform">
        <div class="frow" style="align-items:center;gap:16px;padding-bottom:4px">
          <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--text)">
            <input type="checkbox" id="fesp" onchange="toggleEsp()" style="width:16px;height:16px;accent-color:var(--primary)">
            Himno especial (sin número)
          </label>
        </div>
        <div class="frow">
          <div class="fg" id="fnumWrap" style="max-width:100px">
            <label for="fnum">Número</label>
            <input type="text" inputmode="numeric" id="fnum" placeholder="1" oninput="if(/^e/i.test(this.value)){document.getElementById('fesp').checked=true;toggleEsp();this.value='';}">
          </div>
          <div class="fg">
            <label for="ftitle">Título</label>
            <input type="text" id="ftitle" placeholder="Título del himno">
          </div>
          <div class="fg" style="max-width:120px">
            <label for="fkey">Tonalidad</label>
            <input type="text" id="fkey" placeholder="Do, C, Fa#…">
          </div>
        </div>
        <div class="fg full">
          <label for="fcontent">Letra y acordes</label>
          <div class="hint">
            Coloca el acorde entre corchetes donde cambia: <code>[Do]Cuan[Sol]do</code> o <code>[C]When[G] it</code><br>
            Acepta notación latina (<code>Do Re Fa# Sib</code>) y americana (<code>C D F# Bb</code>) mezcladas.
          </div>
          <textarea id="fcontent" placeholder="[Do]Cuando me ena[Sol]moré de [Do]ti&#10;[Fa]Todo cam[Sol]bió en [Do]mí"></textarea>
        </div>
        <div class="factions">
          <button class="btn btn-p" onclick="saveHymn()">💾 Guardar</button>
          <div class="sp"></div>
          <button class="btn btn-d btn-sm" id="deleteBtn" onclick="deleteHymn()" style="display:none">🗑 Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ COLAS (lista) ═══ -->
  <div class="view" id="view-colas">
    <div class="vbar">
      <button class="btn btn-s btn-sm" onclick="showList()">← Volver</button>
      <span class="vbar-title">Cola de himnos</span>
      <button class="btn btn-p btn-sm admin-only" onclick="showColaEdit(null)">+ Nueva</button>
    </div>
    <div class="card">
      <ul id="colaList" style="list-style:none"></ul>
    </div>
  </div>

  <!-- ═══ COLA VISTA ═══ -->
  <div class="view" id="view-cola-view">
    <div class="vbar">
      <button class="btn btn-s btn-sm" onclick="showColas()">← Volver</button>
      <span class="vbar-title" id="colaViewTitulo"></span>
      <button class="btn btn-s btn-sm admin-only" onclick="showColaEdit(S.colaId)">✎ Editar</button>
    </div>
    <div class="card">
      <div style="padding:10px 18px;border-bottom:1px solid var(--border)">
        <span style="font-size:.85rem;color:var(--muted);font-weight:700" id="colaViewFecha"></span>
      </div>
      <ul class="hymn-list" id="colaViewList"></ul>
    </div>
  </div>

  <!-- ═══ COLA EDITOR ═══ -->
  <div class="view" id="view-cola-edit">
    <div class="vbar">
      <button class="btn btn-s btn-sm" onclick="showColas()">← Cancelar</button>
      <span class="vbar-title" id="colaEdTitle">Nueva cola</span>
    </div>
    <div class="card">
      <div class="eform">
        <div class="frow">
          <div class="fg" style="max-width:185px">
            <label for="cFecha">Fecha</label>
            <input type="date" id="cFecha">
          </div>
          <div class="fg">
            <label for="cTitulo">Título (opcional)</label>
            <input type="text" id="cTitulo" placeholder="Ej: Servicio dominical">
          </div>
        </div>
        <div class="fg full">
          <label>Himnos en cola</label>
          <ul class="cq-list" id="colaQueue"></ul>
        </div>
        <div class="fg full">
          <label for="colaSearch">Agregar himno</label>
          <input type="text" id="colaSearch" placeholder="Buscar por número o título…" oninput="renderColaSearch()">
          <ul class="pick-results" id="colaPickResults"></ul>
        </div>
        <div class="factions">
          <button class="btn btn-p" onclick="saveCola()">💾 Guardar cola</button>
          <div class="sp"></div>
          <button class="btn btn-d btn-sm" id="colaDeleteBtn" onclick="deleteCola()" style="display:none">🗑 Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ═══ MODAL DE AUTENTICACIÓN ═══ -->
<div class="modal-bg" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">Acceso administrador</h3>
    <p id="modalDesc"></p>
    <input type="password" id="pinA" placeholder="PIN" autocomplete="off" onkeydown="if(event.key==='Enter')submitPin()">
    <input type="password" id="pinB" placeholder="Confirmar PIN" autocomplete="off"
           style="display:none;margin-top:6px" onkeydown="if(event.key==='Enter')submitPin()">
    <div class="pin-error" id="pinErr"></div>
    <div class="modal-actions">
      <button class="btn btn-s btn-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-p btn-sm" id="pinSubmit" onclick="submitPin()">Entrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════
// § 1  SISTEMA DE ACORDES
// ════════════════════════════════════════════════════════════════

const NOTE_ST = {
  'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,
  'E':4,'Fb':4,'E#':5,'F':5,'F#':6,'Gb':6,
  'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,
  'B':11,'Cb':11,'B#':0,
  'Do':0,'Do#':1,'Dob':11,
  'Re':2,'Re#':3,'Reb':1,
  'Mi':4,'Mib':3,'Mi#':5,
  'Fa':5,'Fa#':6,'Fab':4,
  'Sol':7,'Sol#':8,'Solb':6,
  'La':9,'La#':10,'Lab':8,
  'Si':11,'Sib':10,'Si#':0,
};

const ROOTS = Object.keys(NOTE_ST).sort((a,b) => b.length - a.length || a.localeCompare(b));

const SHARP = {
  american: ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],
  latin:    ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'],
};

function stName(st, sys) { return SHARP[sys][((st%12)+12)%12]; }

function parseChord(raw) {
  const s = (raw||'').trim();
  if (!s) return null;
  let root=null, rest=s;
  for (const r of ROOTS) { if (s.startsWith(r)) { root=r; rest=s.slice(r.length); break; } }
  if (!root) return null;
  const semitone = NOTE_ST[root];
  let suffix=rest, bassSt=null;
  const si = rest.indexOf('/');
  if (si !== -1) { suffix=rest.slice(0,si); const bp=parseChord(rest.slice(si+1)); if(bp) bassSt=bp.semitone; }
  return { semitone, suffix, bassSt };
}

function chordStr(parsed, sys, offset=0) {
  const st = ((parsed.semitone+offset)%12+12)%12;
  let s = stName(st,sys)+parsed.suffix;
  if (parsed.bassSt!==null) s += '/'+stName(((parsed.bassSt+offset)%12+12)%12,sys);
  return s;
}

function normalizeContent(raw) {
  return raw.replace(/\[([^\]]+)\]/g, (_,ch) => {
    const p=parseChord(ch.trim()); return p ? '['+chordStr(p,'american')+']' : '['+ch+']';
  });
}

function convertContent(stored, sys, offset) {
  if (sys==='american' && offset===0) return stored;
  return stored.replace(/\[([^\]]+)\]/g, (_,ch) => {
    const p=parseChord(ch.trim()); return p ? '['+chordStr(p,sys,offset)+']' : '['+ch+']';
  });
}

// ════════════════════════════════════════════════════════════════
// § 2  RENDERIZADO
// ════════════════════════════════════════════════════════════════

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function splitLine(line) {
  const parts = line.split(/\[([^\]]+)\]/);
  const segs = [];
  if (parts[0]) segs.push({chord:null, text:parts[0]});
  for (let i=1; i<parts.length; i+=2) segs.push({chord:parts[i], text:parts[i+1]??''});
  return segs;
}

function renderLine(line, sys, offset) {
  if (!line.includes('[')) {
    return line.trim()==='' ? '<div class="stanza"></div>' : `<div class="lyric-line">${esc(line)}</div>`;
  }
  const segs = splitLine(line);
  const html = segs.map(({chord,text}) => {
    let cn='';
    if (chord) { const p=parseChord(chord.trim()); cn=p ? esc(chordStr(p,sys,offset)) : esc(chord); }
    const cl = esc(text)||(chord?' ':'');
    return `<span class="cblock"><span class="cn">${cn}</span><span class="cl">${cl}</span></span>`;
  }).join('');
  return `<div class="chord-line">${html}</div>`;
}

function renderFull(content, sys, offset) {
  return content.split('\n').map(l => renderLine(l,sys,offset)).join('');
}

// ════════════════════════════════════════════════════════════════
// § 3  ALMACENAMIENTO — Firebase Firestore
//      Los himnos viven en la colección "hymns" en Firestore.
//      onSnapshot mantiene hymnCache sincronizado en tiempo real:
//      cualquier cambio del admin se refleja al instante en todos
//      los dispositivos sin necesidad de recargar.
//      enablePersistence() permite uso offline (caché en IndexedDB).
// ════════════════════════════════════════════════════════════════

const PK='himnario_prefs';
// Hash SHA-256 del PIN de administrador (fijo en el código, no editable desde el navegador)
const ADMIN_HASH='3bd62f7f9ccb2821f5330bd3a68629ed8b8a1a19370adf7d74636e76a698d430';

// Inicializar Firebase
firebase.initializeApp({

  authDomain: "himnario-ieap.firebaseapp.com",

});

const firestore = firebase.firestore();
const hymnsCol  = firestore.collection('hymns');

// Habilita persistencia offline (los himnos quedan en caché local)
firestore.enablePersistence().catch(() => {});

// Caché local actualizado en tiempo real por onSnapshot
let hymnCache = [];

const db = {
  all() {
    return [...hymnCache].sort((a,b) => {
      if (a.especial && !b.especial) return 1;
      if (!a.especial && b.especial) return -1;
      if (a.especial && b.especial) return a.titulo.localeCompare(b.titulo);
      return a.numero - b.numero;
    });
  },
  get(id)          { return hymnCache.find(h=>h.id===id)||null; },
  async upsert(h)  { await hymnsCol.doc(h.id).set(h); },
  async remove(id) { await hymnsCol.doc(id).delete(); },
};

function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// ════════════════════════════════════════════════════════════════
// § 4  ESTADO
// ════════════════════════════════════════════════════════════════

const S = { view:'list', hymnId:null, colaId:null, offset:0, sys:'latin' };

function loadPrefs() { try { const p=JSON.parse(localStorage.getItem(PK)); if(p?.sys) S.sys=p.sys; } catch {} }
function savePrefs() { localStorage.setItem(PK,JSON.stringify({sys:S.sys})); }

// ════════════════════════════════════════════════════════════════
// § 5  AUTENTICACIÓN ADMIN
//      El hash del PIN está grabado en el código fuente (no en localStorage),
//      por lo que nadie puede establecer un PIN desde el navegador.
//      La sesión vive en sessionStorage (se borra al cerrar el navegador).
// ════════════════════════════════════════════════════════════════

const SESSION_KEY = 'himnario_admin_session';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function isAdminSession() { return sessionStorage.getItem(SESSION_KEY)==='1'; }
function startSession()   { sessionStorage.setItem(SESSION_KEY,'1'); }
function endSession()     { sessionStorage.removeItem(SESSION_KEY); }

function updateAdminUI() {
  const admin = isAdminSession();
  document.body.classList.toggle('is-admin', admin);
  const btn = document.getElementById('lockBtn');
  btn.textContent = admin ? '🔓' : '🔒';
  btn.classList.toggle('open', admin);
  btn.title = admin ? 'Cerrar sesión admin' : 'Acceso administrador';
}

function lockBtnClick() {
  if (isAdminSession()) {
    endSession();
    updateAdminUI();
    if (S.view==='editor'||S.view==='cola-edit') showList();
    toast('Sesión cerrada');
  } else {
    openAuthModal();
  }
}

function openAuthModal() {
  document.getElementById('modalTitle').textContent = 'Acceso administrador';
  document.getElementById('modalDesc').textContent  = 'Ingresa tu PIN para activar el modo edición.';
  document.getElementById('pinSubmit').textContent  = 'Entrar';
  document.getElementById('pinErr').textContent     = '';
  document.getElementById('pinA').value             = '';
  document.getElementById('pinB').style.display     = 'none';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('pinA').focus(), 80);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('modal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

async function submitPin() {
  const a = document.getElementById('pinA').value;
  const err = document.getElementById('pinErr');
  err.textContent = '';
  if (!a) { err.textContent = 'El PIN no puede estar vacío.'; return; }

  const hash = await sha256(a);
  if (hash !== ADMIN_HASH) {
    err.textContent = 'PIN incorrecto.';
    document.getElementById('pinA').value = '';
    document.getElementById('pinA').focus();
    return;
  }
  startSession();
  updateAdminUI();
  closeModal();
  toast('Sesión admin iniciada 🔓');
}

/** Guarda requiere ser admin. Si no lo es, pide login y reintenta. */
function requireAdmin(action) {
  if (isAdminSession()) { action(); return; }
  openAuthModal('login');
}

// ════════════════════════════════════════════════════════════════
// § 6  VISTAS
// ════════════════════════════════════════════════════════════════

function showView(name) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  S.view = name;
}

function renderList() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let hs = db.all();
  if (q) hs = hs.filter(h =>
    (!h.especial && String(h.numero).includes(q)) ||
    h.titulo.toLowerCase().includes(q) ||
    (h.especial && 'esp'.includes(q))
  );
  const ul = document.getElementById('hymnList');
  if (!hs.length) {
    ul.innerHTML=`<li class="empty"><strong>${q?'Sin resultados':'¡El himnario está vacío!'}</strong><br>
      <span style="font-size:.9rem">${q?`No hay resultados para "${esc(q)}"`:'Inicia sesión como admin para agregar himnos.'}</span></li>`;
    return;
  }
  ul.innerHTML = hs.map(h => {
    const kn = h.tonalidad!=null ? stName(h.tonalidad,S.sys)+(h.tSuffix||'') : '';
    const numHtml = h.especial
      ? `<span class="esp-badge">ESP</span>`
      : `<span class="hnum">${h.numero}</span>`;
    return `<li class="hymn-item" onclick="showHymn('${h.id}')">
      ${numHtml}
      <span class="htitle">${esc(h.titulo)}</span>
      ${kn?`<span class="kbadge">${kn}</span>`:''}
    </li>`;
  }).join('');
}

function showList() { S.offset=0; showView('list'); renderList(); }

function showHymn(id) { S.hymnId=id; S.offset=0; refreshHymn(); showView('hymn'); }

function refreshHymn() {
  const h = db.get(S.hymnId); if(!h) return;
  const kt = (((h.tonalidad??0)+S.offset)%12+12)%12;
  const kn = h.tonalidad!=null ? stName(kt,S.sys)+(h.tSuffix||'') : '—';
  const off = S.offset===0?'0':(S.offset>0?'+'+S.offset:S.offset);
  document.getElementById('vbarTitle').textContent = h.titulo;
  document.getElementById('vNum').textContent      = h.especial ? 'ESP' : '#'+h.numero;
  document.getElementById('vTitle').textContent    = h.titulo;
  document.getElementById('kDisp').textContent     = kn;
  document.getElementById('tOffset').textContent   = off;
  document.getElementById('hymnBody').innerHTML    = renderFull(h.contenido,S.sys,S.offset);
}

function doTranspose(d) { S.offset+=d; refreshHymn(); }
function resetTranspose() { S.offset=0; refreshHymn(); }
function editCurrent() { if(S.hymnId) showEditor(S.hymnId); }

function showEditor(id) {
  if (!isAdminSession()) { openAuthModal('login'); return; }
  S.hymnId = id;
  const h = id ? db.get(id) : null;
  document.getElementById('edTitle').textContent       = h ? 'Editar himno' : 'Nuevo himno';
  document.getElementById('deleteBtn').style.display   = h ? '' : 'none';
  const esp = !!(h?.especial);
  document.getElementById('fesp').checked = esp;
  document.getElementById('fnumWrap').style.display = esp ? 'none' : '';
  if (h) {
    document.getElementById('fnum').value     = h.numero || '';
    document.getElementById('ftitle').value   = h.titulo;
    document.getElementById('fkey').value     = h.tonalidad!=null ? stName(h.tonalidad,S.sys)+(h.tSuffix||'') : '';
    document.getElementById('fcontent').value = convertContent(h.contenido,S.sys,0);
  } else {
    ['fnum','ftitle','fkey','fcontent'].forEach(i=>document.getElementById(i).value='');
  }
  showView('editor');
}

function cancelEdit() { if(S.hymnId) showHymn(S.hymnId); else showList(); }

function toggleEsp() {
  const esp = document.getElementById('fesp').checked;
  document.getElementById('fnumWrap').style.display = esp ? 'none' : '';
}

async function saveHymn() {
  if (!isAdminSession()) return;
  const esp    = document.getElementById('fesp').checked;
  const num    = esp ? null : parseInt(document.getElementById('fnum').value, 10);
  const titulo = document.getElementById('ftitle').value.trim();
  const keyRaw = document.getElementById('fkey').value.trim();
  const cRaw   = document.getElementById('fcontent').value;
  if (!esp && (!num||num<1)) return toast('Ingresa un número válido');
  if (!titulo)               return toast('El título es obligatorio');
  let tonalidad = null, tSuffix = '';
  if (keyRaw) { const p=parseChord(keyRaw); if(!p) return toast('Tonalidad no reconocida: '+keyRaw); tonalidad=p.semitone; tSuffix=p.suffix||''; }
  const hymn = { id:S.hymnId||genId(), especial:esp, numero:num, titulo, tonalidad, tSuffix, contenido:normalizeContent(cRaw) };
  await db.upsert(hymn);
  S.hymnId = hymn.id;
  toast('Himno guardado ✓');
  showHymn(hymn.id);
}

async function deleteHymn() {
  if (!isAdminSession()) return;
  if (!S.hymnId||!confirm('¿Eliminar este himno? Esta acción no se puede deshacer.')) return;
  await db.remove(S.hymnId);
  S.hymnId=null;
  toast('Himno eliminado');
  showList();
}

function toggleNotation() {
  S.sys = S.sys==='american' ? 'latin' : 'american';
  savePrefs();
  document.getElementById('ntoggle').textContent = S.sys==='american' ? 'C-D-E' : 'Do-Re-Mi';
  if (S.view==='list')   renderList();
  if (S.view==='hymn')   refreshHymn();
  if (S.view==='editor' && S.hymnId) {
    const h=db.get(S.hymnId);
    if(h){ document.getElementById('fkey').value=h.tonalidad!=null?stName(h.tonalidad,S.sys)+(h.tSuffix||''):''; document.getElementById('fcontent').value=convertContent(h.contenido,S.sys,0); }
  }
}

// ════════════════════════════════════════════════════════════════
// § 7  IMPORTAR / EXPORTAR
// ════════════════════════════════════════════════════════════════

function exportJSON() {
  if (!isAdminSession()) return;
  const blob=new Blob([JSON.stringify(db.load(),null,2)],{type:'application/json'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'himnario_backup.json'});
  a.click(); URL.revokeObjectURL(a.href);
}

function importJSON(evt) {
  if (!isAdminSession()) return;
  const file=evt.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=async e=>{
    try {
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data.hymns)) throw new Error('Formato inválido');
      if(!confirm(`Importar ${data.hymns.length} himno(s)?`)) return;
      const batch=firestore.batch();
      data.hymns.forEach(h=>batch.set(hymnsCol.doc(h.id),h));
      await batch.commit();
      toast(`${data.hymns.length} himno(s) importado(s) ✓`);
    } catch(err){ toast('Error: '+err.message); }
  };
  r.readAsText(file); evt.target.value='';
}

// ════════════════════════════════════════════════════════════════
// § 8  COLA DE HIMNOS
// ════════════════════════════════════════════════════════════════

const colasCol = firestore.collection('colas');
let colaCache = [];
let editColaHimnos = [];

colasCol.onSnapshot(snap => {
  colaCache = snap.docs.map(d => d.data());
  if (S.view==='colas') renderColas();
  if (S.view==='cola-view') { const c=colaCache.find(x=>x.id===S.colaId); if(c) renderColaView(c); }
}, err => console.error('Firestore colas:', err));

function showColas() { showView('colas'); renderColas(); }

function renderColas() {
  const list = [...colaCache].sort((a,b)=>a.fecha>b.fecha?-1:1);
  const ul = document.getElementById('colaList');
  if (!list.length) {
    ul.innerHTML=`<li class="empty"><strong>Sin colas</strong><br><span style="font-size:.9rem">Crea una cola para planificar el orden de los himnos.</span></li>`;
    return;
  }
  ul.innerHTML = list.map(c=>{
    const fecha = c.fecha ? new Date(c.fecha+'T12:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}) : '—';
    const n = (c.himnos||[]).length;
    return `<li class="cola-item" onclick="showColaView('${c.id}')">
      <span class="cola-fecha">${esc(fecha)}</span>
      <span class="cola-titulo">${esc(c.titulo||'')}</span>
      <span class="cola-count">${n} himno${n!==1?'s':''}</span>
      <button class="btn btn-s btn-sm admin-only" style="flex-shrink:0" onclick="event.stopPropagation();showColaEdit('${c.id}')">✎</button>
    </li>`;
  }).join('');
}

function showColaView(id) {
  const c = colaCache.find(x=>x.id===id); if(!c) return;
  S.colaId = id;
  const fecha = c.fecha ? new Date(c.fecha+'T12:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : '';
  document.getElementById('colaViewTitulo').textContent = c.titulo || fecha;
  document.getElementById('colaViewFecha').textContent  = fecha;
  renderColaView(c);
  showView('cola-view');
}

function renderColaView(c) {
  const ul = document.getElementById('colaViewList');
  const himnos = (c.himnos||[]).map(id=>db.get(id)).filter(Boolean);
  if (!himnos.length) { ul.innerHTML='<li class="empty">Sin himnos en esta cola.</li>'; return; }
  ul.innerHTML = himnos.map((h,i)=>{
    const numHtml = h.especial?`<span class="esp-badge">ESP</span>`:`<span class="hnum">${h.numero}</span>`;
    return `<li class="hymn-item" onclick="showHymn('${h.id}')">
      <span style="color:var(--muted);font-size:.82rem;min-width:20px">${i+1}.</span>
      ${numHtml}<span class="htitle">${esc(h.titulo)}</span>
    </li>`;
  }).join('');
}

function showColaEdit(id) {
  if (!isAdminSession()) { openAuthModal(); return; }
  S.colaId = id;
  const c = id ? colaCache.find(x=>x.id===id) : null;
  document.getElementById('colaEdTitle').textContent     = c ? 'Editar cola' : 'Nueva cola';
  document.getElementById('colaDeleteBtn').style.display = c ? '' : 'none';
  document.getElementById('cFecha').value                = c?.fecha||'';
  document.getElementById('cTitulo').value               = c?.titulo||'';
  editColaHimnos = [...(c?.himnos||[])];
  document.getElementById('colaSearch').value            = '';
  document.getElementById('colaPickResults').innerHTML   = '';
  renderColaQueue();
  showView('cola-edit');
}

function renderColaQueue() {
  const ul = document.getElementById('colaQueue');
  if (!editColaHimnos.length) {
    ul.innerHTML='<li style="padding:12px;color:var(--muted);font-size:.88rem;text-align:center">Agrega himnos abajo</li>';
    return;
  }
  ul.innerHTML = editColaHimnos.map((id,i)=>{
    const h=db.get(id); if(!h) return '';
    const numHtml=h.especial?`<span class="esp-badge" style="flex-shrink:0">ESP</span>`:`<span class="hnum" style="flex-shrink:0">${h.numero}</span>`;
    return `<li class="cq-item">
      <span class="cq-idx">${i+1}.</span>
      ${numHtml}
      <span class="cq-title">${esc(h.titulo)}</span>
      <div class="cq-move">
        <button onclick="colaMove(${i},-1)" ${i===0?'disabled':''}>▲</button>
        <button onclick="colaMove(${i},+1)" ${i===editColaHimnos.length-1?'disabled':''}>▼</button>
      </div>
      <button class="cq-rm" onclick="colaRemove(${i})">✕</button>
    </li>`;
  }).join('');
}

function colaMove(i,dir) {
  const j=i+dir; if(j<0||j>=editColaHimnos.length) return;
  [editColaHimnos[i],editColaHimnos[j]]=[editColaHimnos[j],editColaHimnos[i]];
  renderColaQueue();
}

function colaRemove(i) { editColaHimnos.splice(i,1); renderColaQueue(); }

function renderColaSearch() {
  const q=document.getElementById('colaSearch').value.trim().toLowerCase();
  const ul=document.getElementById('colaPickResults');
  if(!q){ul.innerHTML='';return;}
  const res=db.all().filter(h=>
    (!h.especial&&String(h.numero).includes(q))||h.titulo.toLowerCase().includes(q)||(h.especial&&'esp'.includes(q))
  ).slice(0,8);
  if(!res.length){ul.innerHTML='<li class="pick-item" style="color:var(--muted)">Sin resultados</li>';return;}
  ul.innerHTML=res.map(h=>{
    const numHtml=h.especial?`<span class="esp-badge">ESP</span>`:`<span class="hnum">${h.numero}</span>`;
    return `<li class="pick-item" onclick="colaAddHymn('${h.id}')">
      ${numHtml}<span>${esc(h.titulo)}</span>
    </li>`;
  }).join('');
}

function colaAddHymn(id) {
  editColaHimnos.push(id);
  renderColaQueue();
  document.getElementById('colaSearch').value='';
  document.getElementById('colaPickResults').innerHTML='';
}

async function saveCola() {
  if(!isAdminSession()) return;
  const fecha=document.getElementById('cFecha').value;
  const titulo=document.getElementById('cTitulo').value.trim();
  if(!fecha) return toast('Ingresa una fecha');
  const cola={id:S.colaId||genId(),fecha,titulo,himnos:editColaHimnos};
  await colasCol.doc(cola.id).set(cola);
  S.colaId=cola.id;
  toast('Cola guardada ✓');
  showColas();
}

async function deleteCola() {
  if(!isAdminSession()) return;
  if(!S.colaId||!confirm('¿Eliminar esta cola?')) return;
  await colasCol.doc(S.colaId).delete();
  S.colaId=null;
  toast('Cola eliminada');
  showColas();
}

let _tt;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2600);
}

// ════════════════════════════════════════════════════════════════
// § 9  LISTENER FIRESTORE + ARRANQUE
//      onSnapshot escucha cambios en la colección en tiempo real.
//      Cada vez que el admin guarda o elimina desde cualquier
//      dispositivo, todos los clientes reciben el snapshot nuevo
//      y re-renderizan la vista activa automáticamente.
// ════════════════════════════════════════════════════════════════


if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

loadPrefs();
document.getElementById('ntoggle').textContent = S.sys==='american' ? 'C-D-E' : 'Do-Re-Mi';
updateAdminUI();

// Conectar listener en tiempo real — actualiza hymnCache y re-renderiza
hymnsCol.onSnapshot(snapshot => {
  hymnCache = snapshot.docs.map(doc => doc.data());
  if (S.view==='list') renderList();
  if (S.view==='hymn') refreshHymn();
}, err => console.error('Firestore:', err));
